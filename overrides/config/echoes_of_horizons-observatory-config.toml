
#Observatory : 4 galaxies, 3 planets each. Planet code = galaxy number + planet number :
#  11 12 13  |  21 22 23  |  31 32 33  |  41 42 43
#Colors are hex codes like #47C9D0 (empty = automatic). A galaxy color tints the whole menu.
#lock = true hides a planet behind a ?. Locking planet 1 (11, 21, 31, 41) hides the whole galaxy.
#Unlock : /eoh observatory add <player> <code>, or right-click an Observatory block holding unlock_item.
#planet_count = 0 disables a galaxy.
#
#Example (not used by the game) :
[example_aecora]
	#Name displayed for this planet.
	display_name = "Aecora"
	#Id of the target dimension.
	dimension = "eoh:aecora"
	#Lore text shown when the planet is selected (optional).
	description = "A drowned world of cyan tides and luminous canopies."
	#Planet color (optional).
	color = "#47C9D0"
	#Block the landing platform is built with.
	platform_block = "minecraft:stone"
	#true = locked until unlocked.
	lock = false
	#Item that unlocks the planet when right-clicked on an Observatory block (optional).
	unlock_item = "minecraft:ender_eye"
	#Advancement id that unlocks the planet (optional). Alone, the planet unlocks as soon as it is earned. With unlock_item, the item is refused on an Observatory block until the advancement is earned.
	unlock_advancement = "minecraft:story/enter_the_nether"

